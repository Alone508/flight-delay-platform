# 天气事件：taildir -> 两个独立 memory channel -> Kafka + HDFS
weatherAgent.sources = tail
weatherAgent.channels = memKafka memHdfs
weatherAgent.sinks = kafka hdfs

weatherAgent.sources.tail.type = TAILDIR
weatherAgent.sources.tail.filegroups = f1
weatherAgent.sources.tail.filegroups.f1 = /home/alone/projects/flights/flight-delay-platform/data/logs/weather_events.log
weatherAgent.sources.tail.positionFile = /home/alone/projects/flights/flight-delay-platform/data/logs/.flume_weather_pos
weatherAgent.sources.tail.batchSize = 100
weatherAgent.sources.tail.channels = memKafka memHdfs

weatherAgent.channels.memKafka.type = memory
weatherAgent.channels.memKafka.capacity = 10000
weatherAgent.channels.memKafka.transactionCapacity = 1000
weatherAgent.channels.memKafka.keep-alive = 3

weatherAgent.channels.memHdfs.type = memory
weatherAgent.channels.memHdfs.capacity = 10000
weatherAgent.channels.memHdfs.transactionCapacity = 1000
weatherAgent.channels.memHdfs.keep-alive = 3

weatherAgent.sinks.kafka.type = org.apache.flume.sink.kafka.KafkaSink
weatherAgent.sinks.kafka.channel = memKafka
weatherAgent.sinks.kafka.kafka.bootstrap.servers = localhost:9092
weatherAgent.sinks.kafka.kafka.topic = weather-events
weatherAgent.sinks.kafka.flumeBatchSize = 50
weatherAgent.sinks.kafka.kafka.producer.acks = 1
weatherAgent.sinks.kafka.useFlumeEventFormat = false

weatherAgent.sinks.hdfs.type = hdfs
weatherAgent.sinks.hdfs.channel = memHdfs
weatherAgent.sinks.hdfs.hdfs.path = hdfs://localhost:9000/flight/ods/weather/%Y%m%d/%H
weatherAgent.sinks.hdfs.hdfs.filePrefix = weather-
weatherAgent.sinks.hdfs.hdfs.fileType = DataStream
weatherAgent.sinks.hdfs.hdfs.writeFormat = Text
weatherAgent.sinks.hdfs.hdfs.rollInterval = 60
weatherAgent.sinks.hdfs.hdfs.rollSize = 67108864
weatherAgent.sinks.hdfs.hdfs.rollCount = 0
weatherAgent.sinks.hdfs.hdfs.batchSize = 1000
weatherAgent.sinks.hdfs.hdfs.useLocalTimeStamp = true
weatherAgent.sinks.hdfs.hdfs.callTimeout = 60000
weatherAgent.sinks.hdfs.hdfs.idleTimeout = 60
