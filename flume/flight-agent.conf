# 航班事件：taildir -> 两个独立 memory channel -> Kafka + HDFS
# 注意：一个 channel 接多个 sink 时是竞争消费（事件被分流），
# 必须为每个 sink 配置独立 channel，才能实现广播。
flightAgent.sources = tail
flightAgent.channels = memKafka memHdfs
flightAgent.sinks = kafka hdfs

flightAgent.sources.tail.type = TAILDIR
flightAgent.sources.tail.filegroups = f1
flightAgent.sources.tail.filegroups.f1 = /home/alone/projects/flights/flight-delay-platform/data/logs/flight_events.log
flightAgent.sources.tail.positionFile = /home/alone/projects/flights/flight-delay-platform/data/logs/.flume_flight_pos
flightAgent.sources.tail.batchSize = 100
flightAgent.sources.tail.channels = memKafka memHdfs

flightAgent.channels.memKafka.type = memory
flightAgent.channels.memKafka.capacity = 10000
flightAgent.channels.memKafka.transactionCapacity = 1000
flightAgent.channels.memKafka.keep-alive = 3

flightAgent.channels.memHdfs.type = memory
flightAgent.channels.memHdfs.capacity = 10000
flightAgent.channels.memHdfs.transactionCapacity = 1000
flightAgent.channels.memHdfs.keep-alive = 3

flightAgent.sinks.kafka.type = org.apache.flume.sink.kafka.KafkaSink
flightAgent.sinks.kafka.channel = memKafka
flightAgent.sinks.kafka.kafka.bootstrap.servers = localhost:9092
flightAgent.sinks.kafka.kafka.topic = flight-events
flightAgent.sinks.kafka.flumeBatchSize = 100
flightAgent.sinks.kafka.kafka.producer.acks = 1
flightAgent.sinks.kafka.useFlumeEventFormat = false

flightAgent.sinks.hdfs.type = hdfs
flightAgent.sinks.hdfs.channel = memHdfs
flightAgent.sinks.hdfs.hdfs.path = hdfs://localhost:9000/flight/ods/events/%Y%m%d/%H
flightAgent.sinks.hdfs.hdfs.filePrefix = flight-
flightAgent.sinks.hdfs.hdfs.fileType = DataStream
flightAgent.sinks.hdfs.hdfs.writeFormat = Text
flightAgent.sinks.hdfs.hdfs.rollInterval = 60
flightAgent.sinks.hdfs.hdfs.rollSize = 67108864
flightAgent.sinks.hdfs.hdfs.rollCount = 0
flightAgent.sinks.hdfs.hdfs.batchSize = 1000
flightAgent.sinks.hdfs.hdfs.useLocalTimeStamp = true
flightAgent.sinks.hdfs.hdfs.callTimeout = 60000
flightAgent.sinks.hdfs.hdfs.idleTimeout = 60
